<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 주사위 대결 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            width: 350px;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .dice-area {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .dice-box {
            background: #ffffff;
            color: #333;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #message {
            font-size: 18px;
            margin: 15px 0;
            height: 25px;
            font-weight: bold;
            color: #ffeb3b;
        }
        button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        button:hover { background-color: #f57c00; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🎲 주사위 대결 🎲</h1>
        <p>먼저 3승을 거두는 쪽이 승리합니다!</p>
        
        <div class="score-board">
            <div>플레이어: <span id="player-score">0</span></div>
            <div>컴퓨터: <span id="ai-score">0</span></div>
        </div>

        <div class="dice-area">
            <div>
                <p>플레이어</p>
                <div class="dice-box" id="player-dice">-</div>
            </div>
            <div>
                <p>컴퓨터</p>
                <div class="dice-box" id="ai-dice">-</div>
            </div>
        </div>

        <div id="message">주사위를 굴려주세요!</div>

        <button id="roll-btn" onclick="playGame()">주사위 굴리기</button>
    </div>

    <script>
        let playerScore = 0;
        let aiScore = 0;
        const targetScore = 3;

        function playGame() {
            const playerDiceEl = document.getElementById('player-dice');
            const aiDiceEl = document.getElementById('ai-dice');
            const messageEl = document.getElementById('message');
            const rollBtn = document.getElementById('roll-btn');

            // 주사위 굴리는 애니메이션 효과 (숫자가 빠르게 바뀌는 것처럼 보이게)
            let count = 0;
            rollBtn.disabled = true;
            messageEl.textContent = "주사위가 굴러가는 중...";

            const interval = setInterval(() => {
                playerDiceEl.textContent = Math.floor(Math.random() * 6) + 1;
                aiDiceEl.textContent = Math.floor(Math.random() * 6) + 1;
                count++;

                if (count > 10) {
                    clearInterval(interval);
                    
                    // 최종 주사위 눈 결정 (1~6)
                    const playerRoll = Math.floor(Math.random() * 6) + 1;
                    const aiRoll = Math.floor(Math.random() * 6) + 1;

                    playerDiceEl.textContent = playerRoll;
                    aiDiceEl.textContent = aiRoll;

                    // 승패 판정
                    if (playerRoll > aiRoll) {
                        playerScore++;
                        messageEl.textContent = "🎉 이번 라운드 승리!";
                    } else if (playerRoll < aiRoll) {
                        aiScore++;
                        messageEl.textContent = "😢 이번 라운드 패배...";
                    } else {
                        messageEl.textContent = "🤝 무승부!";
                    }

                    document.getElementById('player-score').textContent = playerScore;
                    document.getElementById('ai-score').textContent = aiScore;

                    // 게임 종료 조건 확인
                    if (playerScore === targetScore || aiScore === targetScore) {
                        if (playerScore === targetScore) {
                            messageEl.textContent = "🏆 최종 승리하셨습니다!";
                        } else {
                            messageEl.textContent = "💀 컴퓨터의 최종 승리!";
                        }
                        rollBtn.textContent = "게임 재시작";
                        rollBtn.onclick = resetGame;
                    }
                    
                    rollBtn.disabled = false;
                }
            }, 50);
        }

        function resetGame() {
            playerScore = 0;
            aiScore = 0;
            document.getElementById('player-score').textContent = '0';
            document.getElementById('ai-score').textContent = '0';
            document.getElementById('player-dice').textContent = '-';
            document.getElementById('ai-dice').textContent = '-';
            document.getElementById('message').textContent = "주사위를 굴려주세요!";
            
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.textContent = "주사위 굴리기";
            rollBtn.onclick = playGame;
        }
    </script>

</body>
</html>
